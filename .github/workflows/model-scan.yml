name: model-scan

on:
  pull_request:

permissions:
  contents: read
  security-events: write
  id-token: write   # OIDC -> AWS

env:
  AWS_REGION: us-east-1
  DOMAIN: securaai
  REPO: securaai-pypi
  ACCOUNT_ID: 975050056599       
  SCNR_VERSION: "1.0.4"           

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-ci-codeartifact-read
          aws-region: ${{ env.AWS_REGION }}

      - name: Login pip to CodeArtifact
        run: |
          aws codeartifact login \
            --tool pip \
            --domain "$DOMAIN" \
            --domain-owner "$ACCOUNT_ID" \
            --repository "$REPO" \
            --region "$AWS_REGION"

      - name: Install scanner
        run: |
          python -m pip install -U pip
          pip install "securaai-scanner[onnx]==${SCNR_VERSION}" huggingface_hub

      - name: Download demo model
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
            "onnx-community/gemma-3-270m-it-ONNX",
            allow_patterns=["onnx/*"],
            local_dir="models/gemma-onnx"
          )
          PY

      - name: Run scan
        run: |
          python -m securaai_scanner.cli scan \
            models/gemma-onnx/onnx \
            --profile healthcare \
            --sarif-out reports/scan.sarif \
            --json-out reports/scan.json \
            --ci

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/scan.sarif