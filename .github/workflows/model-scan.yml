name: model-scan

on:
  pull_request:

permissions:
  contents: read
  security-events: write
  id-token: write   # OIDC -> AWS

env:
  AWS_REGION: us-east-1
  DOMAIN: securaai
  REPO: securaai-pypi
  ACCOUNT_ID: 975050056599 
  SCNR_VERSION: "1.0.4"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pin Python so ONNX wheels are reliable
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-ci-codeartifact-read
          aws-region: ${{ env.AWS_REGION }}

      # Assumes you configured CodeArtifact to proxy public PyPI (Option A)
      - name: Login pip to CodeArtifact
        run: |
          aws codeartifact login \
            --tool pip \
            --domain "$DOMAIN" \
            --domain-owner "$ACCOUNT_ID" \
            --repository "$REPO" \
            --region "$AWS_REGION"

      - name: Install scanner + deps
        run: |
          python -m pip install -U pip
          python -m pip install "securaai-scanner[onnx]==${SCNR_VERSION}" huggingface_hub

      - name: Download model(s) from ml/models.yaml
        run: |
          python - <<'PY'
          import yaml, os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          cfg = yaml.safe_load(open("ml/models.yaml"))
          out_root = Path("models")
          out_root.mkdir(parents=True, exist_ok=True)

          for m in cfg.get("models", []):
              if m.get("source") != "hf": 
                  continue
              repo = m["repo"]
              pats = m.get("patterns") or ["**/*"]
              dest = out_root / (m.get("id") or repo.split("/")[-1])
              dest.mkdir(parents=True, exist_ok=True)
              print(f"[dl] {repo} -> {dest} allow_patterns={pats}")
              snapshot_download(repo_id=repo, allow_patterns=pats, local_dir=str(dest))
          PY


      - name: Run scan
        run: |
          python -m securaai_scanner.cli scan \
            models \
            --profile healthcare \
            --sarif-out reports/scan.sarif \
            --json-out reports/scan.json \
            --ci


      - name: Summarize findings in the job (markdown)
        if: always()
        run: |
          echo "### SecuraAI scan summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/scan.json ]; then
            VERDICT=$(jq -r '.policy.verdict // "pass"' reports/scan.json)
            COUNT=$(jq -r '.findings | length' reports/scan.json)
            echo "- **Verdict:** $VERDICT" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Findings:** $COUNT" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Top findings</summary>" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.findings[:20][] | "- [\(.rule)] \(.message) (\(.file // "n/a"))"' reports/scan.json \
              >> "$GITHUB_STEP_SUMMARY" || true
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No reports/scan.json produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on the PR (first 20 findings)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const core = require('@actions/core');
            try {
              const data = JSON.parse(fs.readFileSync('reports/scan.json','utf8'));
              const verdict = (data.policy && data.policy.verdict || 'pass').toUpperCase();
              const findings = data.findings || [];
              let body = `### SecuraAI scan: **${verdict}**\n\n`;
              body += `**${findings.length}** findings. Artifacts attached to the job.\n\n`;
              if (findings.length) {
                body += findings.slice(0,20).map(f => `- [${f.rule}] ${f.message} (${f.file || 'n/a'})`).join('\n');
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            } catch (e) {
              core.warning(`Could not post PR comment: ${e.message}`);
            }

      - name: Inline annotations (best-effort)
        if: always()
        run: |
          # Emit GitHub workflow command annotations so they show in the Checks tab.
          if [ -f reports/scan.json ]; then
            jq -r '
              .findings[]?
              | "::warning file=\(.file // "model"),line=\(.line // 1),col=\(.col // 1)::[\(.rule)] \(.message)"
            ' reports/scan.json | while read -r line; do echo "$line"; done
          fi

      - name: Attach reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securaai-reports
          path: |
            reports/scan.json
            reports/scan.sarif
          if-no-files-found: warn

      - name: Enforce policy (fail PR on violations)
        run: |
          VERDICT=$(jq -r '.policy.verdict // "pass"' reports/scan.json)
          echo "Verdict: $VERDICT"
          test "$VERDICT" = "pass"