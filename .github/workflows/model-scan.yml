name: model-scan
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write  # OIDC for AWS -> CodeArtifact

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      DOMAIN: securaai                 # CodeArtifact domain
      REPO: securaai-pypi              # CodeArtifact PyPI repo
      ACCOUNT_ID: 975050056599         # AWS account id
      SCANNER_VERSION: "1.0.4"         # the package version you published

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS creds (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.ACCOUNT_ID }}:role/github-ci-codeartifact-read
          aws-region: ${{ env.AWS_REGION }}

      - name: Login pip to CodeArtifact
        run: |
          aws codeartifact login \
            --tool pip \
            --domain "$DOMAIN" \
            --domain-owner "$ACCOUNT_ID" \
            --repository "$REPO" \
            --region "$AWS_REGION"

      - name: Install scanner + helpers
        run: |
          python -m pip install -U pip
          pip install "securaai-scanner[onnx]==${SCANNER_VERSION}" huggingface_hub

      # Simple model fetch so the scan has input.
      - name: Download a small HF ONNX model
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          p = snapshot_download(
              "onnx-community/gemma-3-270m-it-ONNX",
              allow_patterns=["onnx/*"], # keep it lightweight
          )
          print("Downloaded to:", p)
          PY

      - name: SecuraAI model scan
        # This is your public wrapper (composite action) from the scanner repo
        uses: our-org/securaai-action/.github/actions/model-scan@v1
        with:
          path: "onnx"            # subfolder produced by the download step above
          profile: "healthcare"   # or "global"
          package-version: "${{ env.SCANNER_VERSION }}"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/scan.sarif
