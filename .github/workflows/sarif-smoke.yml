name: sarif-smoke
on: pull_request

permissions:
  security-events: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Create dummy SARIF
        run: |
          mkdir -p reports
          cat > reports/scan.sarif <<'JSON'
          {
            "version": "2.1.0",
            "runs": [{
              "tool": { "driver": { "name": "SecuraAI (smoke)" } },
              "results": [{
                "ruleId": "SMOKE_TEST",
                "level": "warning",
                "message": { "text": "This is a synthetic finding." },
                "locations": [{
                  "physicalLocation": { "artifactLocation": { "uri": "models/onnx/model.onnx" }, "region": { "startLine": 1 } }
                }]
              }]
            }]
          }
          JSON
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/scan.sarif
